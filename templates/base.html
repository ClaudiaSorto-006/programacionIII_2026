<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Panel{% endblock %} | MiSistema</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

<!-- Fondo oscuro al abrir el menú en móvil -->
<div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-slate-900/40 lg:hidden"></div>

<!-- ===== Menú lateral ===== -->
<aside id="menu" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform lg:translate-x-0">

    <div class="flex h-16 items-center gap-3 px-6">
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-slate-900 text-white">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </span>
        <div class="leading-tight">
            <p class="font-bold text-slate-900">MiSistema</p>
            <p class="text-xs text-slate-500">Panel de administración</p>
        </div>
    </div>

    <nav class="flex-1 space-y-6 overflow-y-auto px-3 py-4 text-sm font-medium">
        <div>
            <p class="px-3 pb-2 text-xs font-semibold text-slate-400">Resumen</p>
            <a href="/inicio"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 {% if request.path == '/inicio' %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h6v6H4V5zm10 0h6v6h-6V5zM4 15h6v4H4v-4zm10 0h6v4h-6v-4z"/></svg>
                Inicio
            </a>
        </div>

        <div>
            <p class="px-3 pb-2 text-xs font-semibold text-slate-400">Gestión</p>
            <a href="/usuarios"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 {% if request.path == '/usuarios' %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5-3.9M9 11a4 4 0 100-8 4 4 0 000 8zm-7 9v-2a4 4 0 014-4h6a4 4 0 014 4v2"/></svg>
                Usuarios
            </a>
        </div>

        <div>
            <p class="px-3 pb-2 text-xs font-semibold text-slate-400">Sistema</p>
            <a href="/" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-red-50 hover:text-red-600">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="flex items-center gap-3 border-t border-slate-200 p-4">
        <span class="grid h-9 w-9 place-items-center rounded-full bg-teal-100 text-sm font-bold text-teal-700">A</span>
        <div class="leading-tight">
            <p class="text-sm font-semibold text-slate-900">Administrador</p>
            <p class="text-xs text-slate-500">Sesión activa</p>
        </div>
    </div>
</aside>

<!-- ===== Contenido ===== -->
<div class="lg:pl-64">
    <header class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-8">
        <button id="abrir-menu" class="rounded-lg p-2 hover:bg-slate-100 lg:hidden" aria-label="Abrir menú">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h2 class="font-semibold text-slate-900">{% block encabezado %}Panel{% endblock %}</h2>
    </header>

    <main class="p-4 sm:p-8">
        {% block contenido %}{% endblock %}
    </main>
</div>

<script src="/static/js/base.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
